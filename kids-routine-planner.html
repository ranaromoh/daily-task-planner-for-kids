<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Trail — Daily Routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161B33;
    --bg-deep:#10142A;
    --surface:#232A4D;
    --surface-2:#2E3660;
    --surface-3:#3A4372;
    --star:#FFC857;
    --star-dim:#8A7440;
    --kid1:#FF6F91;
    --kid1-dim:#5C3345;
    --kid2:#4ECDC4;
    --kid2-dim:#2C5350;
    --text:#F5F3EA;
    --text-dim:#A8AFCB;
    --success:#7BD389;
    --radius:20px;
    --shadow-sm: 0 4px 14px rgba(0,0,0,.22);
    --shadow-md: 0 10px 28px rgba(0,0,0,.30);
    --shadow-glow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #1F2547 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .twinkle{
    position:absolute;background:#fff;border-radius:50%;
    animation:tw 3s ease-in-out infinite;
  }
  @keyframes tw{0%,100%{opacity:.15;}50%{opacity:.9;}}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  #app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 18px 60px;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{
    background:var(--surface-2);color:var(--text);
    padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:var(--surface-3);transform:translateY(-1px);}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(160deg, #FFD37A, var(--star));color:#3A2A0A;box-shadow:0 6px 18px rgba(255,200,87,.35);}
  .btn-primary:hover{background:linear-gradient(160deg, #FFDE99, #FFD37A);}
  .btn-ghost{background:transparent;color:var(--text-dim);box-shadow:none;}
  .btn-ghost:hover{background:var(--surface);color:var(--text);}
  .btn-danger{background:#4A2A38;color:#FF9FB4;}
  .row{display:flex;gap:10px;align-items:center;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .muted{color:var(--text-dim);}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;
  }
  input, textarea{
    font-family:inherit;background:var(--surface-2);border:2px solid var(--surface-3);
    color:var(--text);border-radius:12px;padding:10px 12px;font-size:15px;width:100%;
  }
  input:focus, textarea:focus{outline:none;border-color:var(--star);}
  .screen{animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none !important;}

  /* HOME */
  .home-header{text-align:center;margin:26px 0 34px;}
  .home-header .eyebrow{
    color:var(--star);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;
    text-shadow:0 0 18px rgba(255,200,87,.4);
  }
  .home-header h1{font-size:36px;margin:8px 0 6px;letter-spacing:-.01em;}
  .home-header p{color:var(--text-dim);margin:0;font-size:15px;}
  .kid-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
  @media (max-width:480px){.kid-cards{grid-template-columns:1fr;}}
  .kid-card{
    border-radius:26px;padding:26px 20px;text-align:center;position:relative;overflow:hidden;
    border:2px solid transparent;transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    box-shadow:var(--shadow-md);
  }
  .kid-card::after{
    content:'';position:absolute;top:-40%;right:-30%;width:70%;height:70%;
    background:radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);pointer-events:none;
  }
  .kid-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-glow);}
  .kid-card:active{transform:scale(.98);}
  .kid-card .avatar{font-size:52px;display:block;margin-bottom:10px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));}
  .kid-card .kname{font-family:'Baloo 2';font-size:23px;font-weight:700;margin:2px 0 8px;}
  .kid-card .kstars{font-weight:800;font-size:15px;}
  .kid1-card{background:linear-gradient(155deg, var(--kid1-dim) 0%, var(--surface) 65%);}
  .kid1-card:hover{border-color:var(--kid1);}
  .kid2-card{background:linear-gradient(155deg, var(--kid2-dim) 0%, var(--surface) 65%);}
  .kid2-card:hover{border-color:var(--kid2);}
  .parent-link{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:38px auto 0;color:var(--text-dim);font-size:13px;font-weight:700;
    background:none;padding:10px;
  }
  .parent-link:hover{color:var(--text);}

  /* KID VIEW */
  .kid-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .back-btn{background:var(--surface);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-dim);}
  .back-btn:hover{color:var(--text);}
  .kid-id{display:flex;align-items:center;gap:10px;}
  .kid-id .avatar-sm{font-size:30px;}
  .kid-id h2{margin:0;font-size:22px;}
  .mode-pill{font-size:12px;padding:5px 12px;}
  .star-total{
    display:flex;align-items:center;gap:8px;background:linear-gradient(160deg, var(--surface), var(--surface-2));
    padding:8px 16px;border-radius:999px;font-family:'Baloo 2';font-weight:700;font-size:18px;
    box-shadow:0 0 0 2px var(--surface-3) inset, 0 4px 12px rgba(255,200,87,.15);
  }
  .star-total .icon{font-size:20px;}

  /* trail */
  .trail-card{background:linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 140%);border-radius:var(--radius);padding:20px;margin-bottom:22px;box-shadow:var(--shadow-sm);}
  .trail-card h3{margin:0 0 14px;font-size:15px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  #trailSvg{width:100%;height:auto;display:block;}
  .milestone-label{font-family:'Nunito';font-weight:800;fill:var(--text-dim);}
  .milestone-label.reached{fill:var(--star);}

  /* routine cards */
  .routine-card{background:var(--surface);border-radius:var(--radius);padding:18px 18px 8px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}
  .routine-card .rhead{display:flex;align-items:center;justify-content:between;gap:10px;margin-bottom:10px;}
  .routine-card h3{margin:0;font-size:18px;flex:1;}
  .routine-card .rprogress{font-size:13px;color:var(--text-dim);font-weight:700;}
  .task-list{list-style:none;margin:0;padding:0;}
  .task{
    display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid rgba(255,255,255,.06);
    cursor:pointer;user-select:none;transition:background .12s ease;border-radius:10px;
  }
  .task:hover{background:rgba(255,255,255,.03);}
  .task:last-child{border-bottom:none;}
  .task .icon{font-size:24px;width:32px;text-align:center;flex-shrink:0;}
  .task .label{flex:1;font-weight:700;font-size:15.5px;}
  .task.done .label{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--success);}
  .checkbox{
    width:28px;height:28px;border-radius:9px;border:2.5px solid var(--surface-3);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .18s cubic-bezier(.34,1.56,.64,1);font-size:15px;
  }
  .task.done .checkbox{background:var(--success);border-color:var(--success);color:#123018;transform:scale(1.08);box-shadow:0 0 0 4px rgba(123,211,137,.18);}
  .task:not(.done):hover .checkbox{border-color:var(--star);}
  .pop{position:relative;}
  .star-pop{
    position:absolute;top:-4px;right:2px;font-size:16px;pointer-events:none;
    animation:popup .7s ease forwards;
  }
  @keyframes popup{
    0%{opacity:0;transform:translateY(0) scale(.5);}
    20%{opacity:1;transform:translateY(-6px) scale(1.2);}
    100%{opacity:0;transform:translateY(-34px) scale(1);}
  }

  /* PARENT LOCK */
  .lock-box{max-width:340px;margin:80px auto 0;text-align:center;}
  .lock-box .lockicon{font-size:44px;margin-bottom:6px;}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin:20px 0;}
  .pin-dot{width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:2px solid var(--surface-3);}
  .pin-dot.filled{background:var(--star);border-color:var(--star);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
  .key{background:var(--surface);padding:16px 0;border-radius:14px;font-size:20px;font-weight:800;color:var(--text);}
  .key:hover{background:var(--surface-2);}
  .key:active{transform:scale(.94);}
  .pin-error{color:#FF9FB4;font-size:13px;font-weight:700;height:18px;margin-top:8px;}

  /* PARENT PANEL */
  .tabbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;}
  .tab{white-space:nowrap;padding:9px 16px;border-radius:12px;background:var(--surface);color:var(--text-dim);font-weight:700;font-size:14px;}
  .tab.active{background:var(--star);color:#3A2A0A;}
  .panel-section{background:var(--surface);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .panel-section h3{margin:0 0 4px;font-size:16px;}
  .panel-section .hint{color:var(--text-dim);font-size:13px;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;}
  .switch{width:50px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;flex-shrink:0;transition:background .2s;}
  .switch.on{background:var(--star);}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;}
  .switch.on::after{left:25px;}
  .task-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .task-edit-row input:first-child{width:56px;text-align:center;flex-shrink:0;}
  .task-order-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
  .mini-arrow{width:26px;height:19px;border-radius:6px;background:var(--surface-3);color:var(--text-dim);font-size:11px;display:flex;align-items:center;justify-content:center;}
  .mini-arrow:hover{background:var(--star);color:#3A2A0A;}
  .mini-arrow[disabled]{opacity:.25;pointer-events:none;}
  .remove-x{background:var(--surface-2);width:34px;height:34px;border-radius:10px;flex-shrink:0;color:var(--text-dim);font-size:16px;}
  .remove-x:hover{background:#4A2A38;color:#FF9FB4;}
  .add-task-btn{width:100%;margin-top:4px;background:var(--surface-2);border:2px dashed var(--surface-3);color:var(--text-dim);padding:10px;border-radius:12px;font-weight:700;}
  .add-task-btn:hover{color:var(--text);border-color:var(--star);}
  .routine-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .routine-chip{padding:8px 14px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--text-dim);}
  .routine-chip.active{background:var(--star);color:#3A2A0A;}
  .prize-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .prize-row input:first-child{width:70px;}
  .order-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:10px 14px;margin-bottom:8px;}
  .order-num{width:22px;height:22px;border-radius:50%;background:var(--star);color:#3A2A0A;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .order-label{flex:1;font-weight:700;font-size:14.5px;}
  .adj-btn[disabled]{opacity:.3;pointer-events:none;}
  .kid-adjust{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .kid-adjust .adj-name{flex:1;font-weight:800;font-family:'Baloo 2';}
  .adj-btn{width:34px;height:34px;border-radius:10px;background:var(--surface-3);font-size:18px;font-weight:800;color:var(--text);}
  .adj-btn:hover{background:var(--star);color:#3A2A0A;}
  .save-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--success);color:#123018;padding:10px 22px;border-radius:999px;font-weight:800;
    font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* task visibility select */
  .vis-select{
    font-family:inherit;background:var(--surface-3);border:none;color:var(--text-dim);
    border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;flex-shrink:0;width:78px;
  }

  /* streak badge */
  .streak-badge{
    display:flex;align-items:center;gap:5px;background:var(--surface);padding:8px 14px;border-radius:999px;
    font-family:'Baloo 2';font-weight:700;font-size:15px;box-shadow:0 0 0 2px var(--surface-3) inset;
  }

  /* almost there */
  .almost-badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--kid1-dim);color:var(--star);
    font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:999px;margin:-2px 0 10px;
    animation:pulseglow 1.4s ease-in-out infinite;
  }
  @keyframes pulseglow{0%,100%{opacity:.75;}50%{opacity:1;}}

  /* speak button */
  .speak-btn{background:transparent;color:var(--text-dim);font-size:15px;width:26px;height:26px;flex-shrink:0;border-radius:8px;}
  .speak-btn:hover{color:var(--star);background:var(--surface-2);}

  /* rest day banner */
  .rest-banner{
    background:linear-gradient(135deg, var(--kid2-dim), var(--surface));border-radius:16px;
    padding:14px 18px;margin-bottom:18px;font-weight:700;text-align:center;
  }

  /* avatar picker */
  .avatar-sm-btn{background:none;font-size:30px;line-height:1;border-radius:10px;}
  .avatar-sm-btn:hover{background:var(--surface);}
  .avatar-picker{
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:var(--surface);
    border-radius:16px;padding:14px;margin-bottom:18px;
  }
  .avatar-choice{background:var(--surface-2);border-radius:12px;font-size:24px;padding:8px 0;}
  .avatar-choice:hover{background:var(--star);}

  /* celebration overlay */
  #celebrateLayer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden;}
  .confetti-piece{position:absolute;top:-30px;font-size:22px;animation:confettifall linear forwards;}
  @keyframes confettifall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:.9; }
  }
  .celebrate-banner{
    position:fixed;top:18%;left:50%;transform:translateX(-50%) scale(.8);
    background:var(--star);color:#3A2A0A;padding:16px 26px;border-radius:18px;
    font-family:'Baloo 2';font-weight:800;font-size:19px;text-align:center;z-index:101;
    box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;
    animation:celebratepop 2.4s ease forwards;
  }
  @keyframes celebratepop{
    0%{opacity:0;transform:translateX(-50%) scale(.7);}
    15%{opacity:1;transform:translateX(-50%) scale(1.05);}
    25%{transform:translateX(-50%) scale(1);}
    85%{opacity:1;}
    100%{opacity:0;transform:translateX(-50%) scale(1);}
  }

  /* history */
  .week-bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin:10px 0 4px;}
  .week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .week-bar{width:100%;max-width:34px;background:var(--star);border-radius:8px 8px 4px 4px;min-height:4px;transition:height .3s ease;}
  .week-bar.zero{background:var(--surface-3);}
  .week-bar-val{font-size:11px;font-weight:800;color:var(--text-dim);margin-bottom:4px;}
  .week-bar-day{font-size:11px;color:var(--text-dim);font-weight:700;margin-top:6px;}
  .week-total{text-align:center;font-family:'Baloo 2';font-size:15px;font-weight:700;margin-top:6px;}
  .note-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .note-row .note-date{width:64px;flex-shrink:0;font-size:12px;color:var(--text-dim);font-weight:700;}

  /* time-gated routines */
  .routine-card.locked-card{opacity:.55;padding-bottom:16px;}
  .routine-card.locked-card .rprogress{color:var(--text-dim);font-weight:700;font-size:12.5px;}
  .locked-msg{padding:6px 2px 2px;color:var(--text-dim);font-weight:700;font-size:14px;}

  /* prizes */
  .prize-list-row{
    display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;
    padding:12px 14px;margin-bottom:8px;
  }
  .prize-list-row.reached{background:linear-gradient(135deg, var(--kid1-dim), var(--surface-2));}
  .prize-thresh{
    width:44px;height:44px;border-radius:12px;background:var(--surface-3);color:var(--text-dim);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
    font-weight:800;font-size:13px;line-height:1.1;
  }
  .prize-list-row.reached .prize-thresh{background:var(--star);color:#3A2A0A;}
  .prize-reward{flex:1;font-weight:700;font-size:14px;}
  .prize-status{font-size:12px;color:var(--text-dim);font-weight:700;}
  .claim-btn{background:var(--star);color:#3A2A0A;padding:9px 16px;border-radius:12px;font-weight:800;font-size:13px;flex-shrink:0;}
  .claim-btn:hover{background:#FFD37A;}
  .trophy-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px;}
  .trophy-row:last-child{border-bottom:none;}
  .trophy-date{color:var(--text-dim);font-size:11.5px;flex-shrink:0;}

  /* avatar builder */
  .builder-preview{display:flex;justify-content:center;padding:20px 0;background:var(--surface);border-radius:var(--radius);margin-bottom:18px;}
  .builder-cat{margin-bottom:18px;}
  .builder-cat-label{font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch-color{width:38px;height:38px;border-radius:50%;border:3px solid transparent;flex-shrink:0;}
  .swatch-color.selected{border-color:var(--star);}
  .swatch-option{padding:9px 14px;border-radius:12px;background:var(--surface-2);color:var(--text-dim);font-weight:700;font-size:13px;}
  .swatch-option.selected{background:var(--star);color:#3A2A0A;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<div id="starfield"></div>
<div id="celebrateLayer"></div>
<div id="app"></div>
<div class="save-toast" id="toast">Saved ✓</div>

<script>
/* ---------------- storage helpers ----------------
   Paste your Firebase config below to enable live syncing across devices.
   Until you do, the app falls back to this-device-only storage (localStorage). */
const firebaseConfig = {
  apiKey: "AIzaSyBzn8-Wz5L19b7ENiN5yxn9BNAvTbAgDI0",
  authDomain: "star-trail-kids.firebaseapp.com",
  databaseURL: "https://star-trail-kids-default-rtdb.firebaseio.com",
  projectId: "star-trail-kids"
};

let fbDB = null;
try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY" && window.firebase){
    firebase.initializeApp(firebaseConfig);
    fbDB = firebase.database();
  }
}catch(e){ console.error('Firebase init failed, falling back to local storage', e); }

const STORAGE_PREFIX = 'starTrail:';
function keyToPath(key){ return 'starTrail/' + key.replace(/:/g,'__'); }

async function storeGet(key, fallback){
  if(fbDB){
    try{
      const snap = await fbDB.ref(keyToPath(key)).once('value');
      const val = snap.val();
      return (val===null || val===undefined) ? fallback : val;
    }catch(e){ return fallback; }
  }
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function storeSet(key, value){
  if(fbDB){
    try{ await fbDB.ref(keyToPath(key)).set(value); return; }
    catch(e){ console.error('firebase set failed', e); }
  }
  try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', e); }
}

async function storeSetMulti(pairs){
  if(fbDB){
    try{
      const updates = {};
      for(const k in pairs) updates[keyToPath(k)] = pairs[k];
      await fbDB.ref().update(updates);
      return;
    }catch(e){ console.error('firebase multi-set failed', e); }
  }
  for(const k in pairs) await storeSet(k, pairs[k]);
}

function startLiveSync(){
  if(!fbDB) return;
  fbDB.ref('starTrail').on('value', (snap)=>{
    if(state.screen==='parent' || state.screen==='lock') return; // don't disrupt active editing
    const data = snap.val() || {};
    const cfgRaw = data[('family-config').replace(/:/g,'__')];
    if(cfgRaw) CONFIG = cfgRaw;
    for(const kid of CONFIG.kids){
      const starsRaw = data[('stars:'+kid.id).replace(/:/g,'__')];
      STARS[kid.id] = (starsRaw===undefined||starsRaw===null) ? (STARS[kid.id]||0) : starsRaw;
      const progRaw = data[(progressKey(kid.id)).replace(/:/g,'__')];
      PROGRESS[kid.id] = progRaw || {};
      const streakRaw = data[('streak:'+kid.id).replace(/:/g,'__')];
      STREAK[kid.id] = streakRaw || {lastDate:null, count:0};
      const histRaw = data[('history:'+kid.id).replace(/:/g,'__')];
      HISTORY[kid.id] = histRaw || {};
      const prizeRaw = data[('prizesLog:'+kid.id).replace(/:/g,'__')];
      PRIZES_LOG[kid.id] = prizeRaw || [];
      const pendingRaw = data[('pendingClaims:'+kid.id).replace(/:/g,'__')];
      PENDING_CLAIMS[kid.id] = pendingRaw || [];
      const behaviorRaw = data[('behaviorLog:'+kid.id).replace(/:/g,'__')];
      BEHAVIOR_LOG[kid.id] = behaviorRaw || [];
    }
    const notesRaw = data[('dayNotes').replace(/:/g,'__')];
    DAY_NOTES = notesRaw || {};
    render();
  });
}

function isWeekendToday(){
  const d = new Date().getDay(); // 0=Sun...5=Fri,6=Sat
  return d===5 || d===6;
}

  return !!CONFIG.holidayMode || isWeekendToday();
}

  return !CONFIG.hideStarsFromKids;

function timeToMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function currentMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function fmtTime12(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  const period = h<12 ? 'AM' : 'PM';
  let h12 = h % 12; if(h12===0) h12 = 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function isRoutineActiveNow(routine){
  if(!routine.startTime || !routine.endTime) return true;
  const now = currentMinutes();
  return now >= timeToMinutes(routine.startTime) && now <= timeToMinutes(routine.endTime);
}
function displayRoutineKeysForToday(){
  let keys = currentRoutineKeys().slice();
  const day = new Date().getDay(); // 6 = Saturday
  if(day===6){
    // Saturday night matches school-day bedtime (same window, already includes a bath) since Sunday is a school day
    keys = keys.map(k => k==='bedtime_holiday' ? 'bedtime_school' : k);
  }
  return keys;
}
function migrateConfig(cfg){
  let changed = false;
  if(!cfg.routineOrder){
    cfg.routineOrder = { school: ROUTINE_KEYS_SCHOOL.slice(), holiday: ROUTINE_KEYS_HOLIDAY.slice() };
    changed = true;
  }
  if(!cfg.routines.afternoon_school){
    cfg.routines.afternoon_school = {label:'Afternoon', startTime:'14:30', endTime:'20:30', tasks:[
      {id:'t1', icon:'📖', label:'Reading time'},
      {id:'t2', icon:'🎨', label:'Hobby / activity time'},
      {id:'t3', icon:'🍽️', label:'Help set the table'},
      {id:'t4', icon:'🧹', label:'Tidy room'}
    ]};
    changed = true;
  }
  if(!cfg.routineOrder.school.includes('afternoon_school')){
    const idx = cfg.routineOrder.school.indexOf('afterschool_school');
    if(idx>=0) cfg.routineOrder.school.splice(idx+1, 0, 'afternoon_school');
    else cfg.routineOrder.school.push('afternoon_school');
    changed = true;
  }
  for(const key in SCHEDULE_DEFAULTS){
    if(cfg.routines[key] && (!cfg.routines[key].startTime || !cfg.routines[key].endTime)){
      cfg.routines[key].startTime = SCHEDULE_DEFAULTS[key].start;
      cfg.routines[key].endTime = SCHEDULE_DEFAULTS[key].end;
      changed = true;
    }
  }
  if(!cfg.behaviorReasons){
    cfg.behaviorReasons = JSON.parse(JSON.stringify(DEFAULT_CONFIG.behaviorReasons));
    changed = true;
  }
  if(cfg.hideStarsFromKids===undefined){
    cfg.hideStarsFromKids = true;
    changed = true;
  }
  cfg.kids.forEach((k,i)=>{
    if(!k.pin){ k.pin = String((i+1)).repeat(4); changed = true; }
  });
  if(!cfg.contentVersion || cfg.contentVersion < 2){
    cfg.routines.morning_school = JSON.parse(JSON.stringify(DEFAULT_CONFIG.routines.morning_school));
    cfg.routines.morning_holiday = JSON.parse(JSON.stringify(DEFAULT_CONFIG.routines.morning_holiday));
    cfg.routines.afterschool_school = JSON.parse(JSON.stringify(DEFAULT_CONFIG.routines.afterschool_school));
    cfg.routines.afternoon_school = JSON.parse(JSON.stringify(DEFAULT_CONFIG.routines.afternoon_school));
    cfg.routines.afterschool_holiday = JSON.parse(JSON.stringify(DEFAULT_CONFIG.routines.afterschool_holiday));
    cfg.contentVersion = 2;
    changed = true;
  }
  return changed;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateStrOffset(offsetDays){
  const d = new Date();
  d.setDate(d.getDate()+offsetDays);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function last7Dates(){
  const arr = [];
  for(let i=6;i>=0;i--) arr.push(dateStrOffset(-i));
  return arr;
}
function dayLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString(undefined,{weekday:'short'});
}
function progressKey(kidId){ return 'progress:'+kidId+':'+todayStr(); }

function buildStarfield(){
  const el = document.getElementById('starfield');
  let html='';
  for(let i=0;i<50;i++){
    const size = (Math.random()*2+1).toFixed(1);
    const top = Math.random()*100;
    const left = Math.random()*100;
    const delay = (Math.random()*3).toFixed(2);
    html += `<div class="twinkle" style="width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation-delay:${delay}s;"></div>`;
  }
  el.innerHTML = html;
}
function toast(msg){
  const t = document.getElementById('toast');

  t.classList.add('show');

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  }

function renderTrail(kid){
  const total = STARS[kid.id]||0;
  const prizes = CONFIG.prizes.slice().sort((a,b)=>a.threshold-b.threshold);
  const maxT = prizes.length ? prizes[prizes.length-1].threshold : 50;
  const w = 640, h = 90, pad = 30;
  const usable = w - pad*2;
  const pct = Math.min(total/maxT,1);
  let path = `M ${pad} ${h/2}`;
  const segments = 4;
  for(let i=1;i<=segments;i++){
    const x = pad + (usable/segments)*i;
    const y = h/2 + (i%2===0 ? -22 : 22);
    path += ` Q ${pad + (usable/segments)*(i-0.5)} ${i%2===0?22:-22+h/2}, ${x} ${y}`;
  }
  let milestones = prizes.map(p=>{
    const mx = pad + usable*Math.min(p.threshold/maxT,1);
    const reached = total >= p.threshold;
    return `<g>
      <circle cx="${mx}" cy="${h/2}" r="9" fill="${reached?'var(--star)':'#3A4372'}" stroke="${reached?'#FFD37A':'#4A5488'}" stroke-width="2"/>
      <text x="${mx}" y="${h-6}" font-size="11" text-anchor="middle" class="milestone-label ${reached?'reached':''}">${p.threshold}</text>
    </g>`;
  }).join('');
  const tokenX = pad + usable*pct;
  return `
  <div class="trail-card">
    <h3>${starsVisibleToKids() ? `Star trail — ${total} / ${maxT}${total>=maxT?' 🎉 Goal reached!':''}` : 'Star trail'}</h3>
    <svg id="trailSvg" viewBox="0 0 ${w} ${h}">
      <path d="M ${pad} ${h/2} L ${w-pad} ${h/2}" stroke="#3A4372" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1 10"/>
      <line x1="${pad}" y1="${h/2}" x2="${tokenX}" y2="${h/2}" stroke="var(--star)" stroke-width="4" stroke-linecap="round"/>
      ${milestones}
      ${kid.avatarType==='custom' ? `<circle cx="${tokenX}" cy="${h/2-16}" r="12" fill="${(kid.avatarConfig&&kid.avatarConfig.outfit)||'#4ECDC4'}"/><text x="${tokenX}" y="${h/2-11}" font-size="14" fill="#fff" text-anchor="middle" font-weight="800">${esc(kid.name[0])}</text>` : `<text x="${tokenX}" y="${h/2-16}" font-size="22" text-anchor="middle">${kid.avatar}</text>`}
    </svg>
  </div>`;
}
function renderWeekBars(kidId, hideNumbers){
  const dates = last7Dates();
  const hist = HISTORY[kidId] || {};
  const vals = dates.map(d=>Math.max(0, hist[d]||0));
  const max = Math.max(...vals, 1);
  const total = vals.reduce((a,b)=>a+b,0);
  const cols = dates.map((d,i)=>{
    const v = vals[i];
    const h = v===0 ? 4 : Math.round((v/max)*110)+4;
    return `<div class="week-bar-col">
      <span class="week-bar-val">${(!hideNumbers && v>0)?v:''}</span>
      <div class="week-bar ${v===0?'zero':''}" style="height:${h}px"></div>
      <span class="week-bar-day">${dayLabel(d)}</span>
    </div>`;
  }).join('');
  const totalLine = hideNumbers ? `<div class="week-total">Keep the streak going! 🌟</div>` : `<div class="week-total">⭐ ${total} stars this week</div>`;
  return `<div class="week-bars">${cols}</div>${totalLine}`;
}

  const prog = PROGRESS[kid.id] || {};
  const visibleTasks = routine.tasks.filter(t=>!t.visibleTo || t.visibleTo==='both' || t.visibleTo===kid.id);
  const doneCount = visibleTasks.filter(t=>prog[routineKey+'::'+t.id]).length;
  const showSpeak = kid.age && kid.age<=8;
  const largeText = kid.age && kid.age<=8;
  const items = visibleTasks.map(t=>{
    const done = !!prog[routineKey+'::'+t.id];
    return `<li class="task ${done?'done':''} pop" data-task="${t.id}" data-routine="${routineKey}" data-kid="${kid.id}">
      <span class="icon">${t.icon}</span>
      <span class="label" ${largeText?'style="font-size:17.5px"':''}>${esc(t.label)}</span>
      ${showSpeak?`<button class="speak-btn" data-speak="${esc(t.label)}">🔊</button>`:''}
      <span class="checkbox">${done?'✓':''}</span>
    </li>`;
  }).join('');
  const remaining = visibleTasks.length - doneCount;
  const almost = remaining===1 && visibleTasks.length>1;
  return `
  <div class="routine-card">
    <div class="rhead">
      <h3>${esc(routine.label)}</h3>
      <span class="rprogress">${doneCount}/${visibleTasks.length}</span>
    </div>
    ${almost?'<div class="almost-badge">✨ Almost there — 1 to go!</div>':''}
    <ul class="task-list">${items}</ul>
  </div>`;
}
function renderLockedRoutineCard(kid, routineKey){
  const r = CONFIG.routines[routineKey];
  const prog = PROGRESS[kid.id] || {};
  const visibleTasks = (r.tasks||[]).filter(t=>!t.visibleTo || t.visibleTo==='both' || t.visibleTo===kid.id);
  const doneCount = visibleTasks.filter(t=>prog[routineKey+'::'+t.id]).length;
  const now = currentMinutes();
  const start = r.startTime ? timeToMinutes(r.startTime) : null;
  const upcoming = start!==null && now < start;
  const window = (r.startTime && r.endTime) ? `${fmtTime12(r.startTime)}–${fmtTime12(r.endTime)}` : '';
  const msg = upcoming
    ? `🔒 Opens at ${fmtTime12(r.startTime)}`
    : (doneCount>0 ? `✅ ${doneCount}/${visibleTasks.length} done earlier` : `⏳ Closed for today`);
  return `
  <div class="routine-card locked-card">
    <div class="rhead">
      <h3>${esc(r.label)}</h3>
      <span class="rprogress">${window}</span>
    </div>
    <div class="locked-msg">${msg}</div>
  </div>`;
}
function renderPrizesPanel(kid){
  const stars = STARS[kid.id]||0;
  const prizes = (CONFIG.prizes||[]).slice().sort((a,b)=>a.threshold-b.threshold);
  const pending = PENDING_CLAIMS[kid.id]||[];
  const rows = prizes.map(p=>{
    const reached = stars >= p.threshold;
    const isPending = pending.some(c=>c.threshold===p.threshold);
    let status, action;
    if(!reached){
      status = starsVisibleToKids() ? `Need ${p.threshold-stars} more ⭐` : '🔒 Keep going!';
      action = '';
    } else if(isPending){
      status = 'Waiting for approval ⏳';
      action = '';
    } else {
      status = 'Unlocked — your choice!';
      action = `<button class="claim-btn" data-requestprize="${kid.id}:${p.threshold}">🎁 Ask to claim</button>`;
    }
    return `
    <div class="prize-list-row ${reached?'reached':''}">
      <div class="prize-thresh">⭐${p.threshold}</div>
      <div>
        <div class="prize-reward">${esc(p.reward)}</div>
        <div class="prize-status">${status}</div>
      </div>
      ${action}
    </div>`;
  }).join('');
  const log = (PRIZES_LOG[kid.id]||[]).slice().reverse().slice(0,5);
  const trophyRows = log.map(entry=>`
    <div class="trophy-row">
      <span>🏆</span><span style="flex:1">${esc(entry.reward)}</span>
      <span class="trophy-date">${entry.date}</span>

  return `

  </div>`;
}

function handlePinKey(k){
  if(k==='⌫'){ state.pinBuffer = state.pinBuffer.slice(0,-1); render(); return; }
  if(state.pinBuffer.length>=4) return;
  state.pinBuffer += k;
  render();
  if(state.pinBuffer.length===4){
    setTimeout(()=>{
      if(state.screen==='kidlock'){
        const kid = CONFIG.kids.find(kk=>kk.id===state.kidId);
        if(kid && state.pinBuffer === kid.pin){
          state.screen='kid'; state.pinBuffer=''; state.pinError='';
        } else {
          state.pinError = 'Wrong code, try again';
          state.pinBuffer='';
        }
      } else {
        if(state.pinBuffer === CONFIG.pin){
          state.screen='parent'; state.pinBuffer=''; state.pinError='';
        } else {
          state.pinError = 'Wrong PIN, try again';
          state.pinBuffer='';
        }
      }
      render();
    }, 150);
  }
}

function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i*0.12;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.35);
      osc.start(start);
      osc.stop(start+0.4);
    });
  }catch(e){ /* audio not available, skip silently */ }
}
function celebrate(msg){
  const layer = document.getElementById('celebrateLayer');
  const emojis = ['⭐','🎉','✨','🌟'];
  for(let i=0;i<28;i++){
    const piece = document.createElement('span');

    piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    piece.style.left = (Math.random()*100)+'%';
    piece.style.animationDuration = (1.6+Math.random()*1.2)+'s';
    piece.style.animationDelay = (Math.random()*0.4)+'s';
    piece.style.fontSize = (16+Math.random()*14)+'px';
    layer.appendChild(piece);
    setTimeout(()=>piece.remove(), 3200);
  }
  const banner = document.createElement('div');
  banner.className = 'celebrate-banner';
  banner.textContent = msg;
  layer.appendChild(banner);
  setTimeout(()=>banner.remove(), 2500);
  playChime();
}

async function toggleTask(kidId, routineKey, taskId, el){
  if(!PROGRESS[kidId]) PROGRESS[kidId] = {};
  const progKey = routineKey + '::' + taskId;
  const wasDone = !!PROGRESS[kidId][progKey];
  PROGRESS[kidId][progKey] = !wasDone;
  const delta = wasDone ? -1 : 1;
  const prevTotal = STARS[kidId]||0;
  STARS[kidId] = Math.max(0, prevTotal + delta);

  if(!HISTORY[kidId]) HISTORY[kidId] = {};
  const today = todayStr();
  HISTORY[kidId][today] = (HISTORY[kidId][today]||0) + delta;

  const writes = {
    [progressKey(kidId)]: PROGRESS[kidId],
    ['stars:'+kidId]: STARS[kidId],
    ['history:'+kidId]: HISTORY[kidId]
  };

  if(!wasDone){
    const popEl = document.createElement('span');
    popEl.className='star-pop';
    popEl.textContent='+1 ⭐';
    el.appendChild(popEl);
    setTimeout(()=>popEl.remove(), 700);

    // milestone celebration
    const kid = CONFIG.kids.find(k=>k.id===kidId);
    const crossedPrize = (CONFIG.prizes||[]).find(p=>prevTotal<p.threshold && STARS[kidId]>=p.threshold);
    if(crossedPrize){
      celebrate(`🎉 ${crossedPrize.threshold} stars! ${crossedPrize.reward}`);
    }

    // perfect-day bonus check
    if(kid){
      const keys = displayRoutineKeysForToday();
      let total=0, done=0;
      for(const rk of keys){
        const visible = (CONFIG.routines[rk].tasks||[]).filter(t=>!t.visibleTo||t.visibleTo==='both'||t.visibleTo===kidId);
        total += visible.length;
        done += visible.filter(t=>PROGRESS[kidId][rk+'::'+t.id]).length;
      }
      if(total>0 && done===total && !PROGRESS[kidId]['__bonusGiven']){
        PROGRESS[kidId]['__bonusGiven'] = true;
        STARS[kidId] = STARS[kidId] + 1;
        HISTORY[kidId][today] = (HISTORY[kidId][today]||0) + 1;
        if(!STREAK[kidId]) STREAK[kidId] = {lastDate:null, count:0};
        const yesterday = dateStrOffset(-1);
        STREAK[kidId].count = (STREAK[kidId].lastDate===yesterday) ? STREAK[kidId].count+1 : 1;
        STREAK[kidId].lastDate = today;
        writes[progressKey(kidId)] = PROGRESS[kidId];
        writes['stars:'+kidId] = STARS[kidId];
        writes['history:'+kidId] = HISTORY[kidId];
        writes['streak:'+kidId] = STREAK[kidId];
        setTimeout(()=>celebrate(`🌟 Perfect day! +1 bonus star`), crossedPrize?900:0);
      }
    }
  }

  await storeSetMulti(writes);
  render();
}

init();
</script>
</body>
</html>
